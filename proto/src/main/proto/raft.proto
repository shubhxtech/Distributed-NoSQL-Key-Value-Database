syntax = "proto3";

package raft.v1;

option java_package         = "com.kvstore.raft.proto";
option java_outer_classname = "RaftProto";
option java_multiple_files  = true;

// ─── Raft Consensus RPCs (Week 4 — stub only in Day 1-2) ────────────────────

service RaftService {
  // Sent by candidates to request votes during leader election.
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

  // Sent by the leader to replicate log entries and as a heartbeat.
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

// ─── RequestVote ─────────────────────────────────────────────────────────────
message RequestVoteRequest {
  int64  term           = 1;  // Candidate's current term
  string candidate_id   = 2;  // Candidate requesting vote
  int64  last_log_index = 3;  // Index of candidate's last log entry
  int64  last_log_term  = 4;  // Term of candidate's last log entry
}

message RequestVoteResponse {
  int64 term         = 1;  // Current term (for candidate to update itself)
  bool  vote_granted = 2;
}

// ─── AppendEntries ───────────────────────────────────────────────────────────
message AppendEntriesRequest {
  int64           term           = 1;  // Leader's current term
  string          leader_id      = 2;
  int64           prev_log_index = 3;
  int64           prev_log_term  = 4;
  repeated LogEntry entries      = 5;  // Empty for heartbeat
  int64           leader_commit  = 6;  // Leader's commit index
}

message AppendEntriesResponse {
  int64 term    = 1;  // Current term (for leader to update itself)
  bool  success = 2;
}

// ─── LogEntry ────────────────────────────────────────────────────────────────
message LogEntry {
  int64  index     = 1;
  int64  term      = 2;
  bytes  command   = 3;  // Serialized KV command (Put/Delete)
}
