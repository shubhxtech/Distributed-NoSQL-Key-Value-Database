# ─── monitoring/prometheus.yml ────────────────────────────────────────────────
# Prometheus scrape configuration for the KV cluster.
#
# Scrape targets:
#   - kv-coordinator   → coordinator-level metrics (routing counters)
#   - kv-node-1/2/3    → per-node metrics (puts, gets, latency, cache hits, compaction)
#
# Metrics are available at /actuator/prometheus on each service.

global:
  scrape_interval:     15s   # How often to scrape targets
  evaluation_interval: 15s   # How often to evaluate rules
  scrape_timeout:      10s

# ── Alerting (stub — configure AlertManager in a later phase) ─────────────────
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# ── Scrape Jobs ───────────────────────────────────────────────────────────────
scrape_configs:

  # Prometheus self-scrape
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # KV Coordinator
  - job_name: kv-coordinator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['coordinator:8080']
        labels:
          service: coordinator

  # KV Storage Nodes
  - job_name: kv-nodes
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'node-1:8080'
          - 'node-2:8080'
          - 'node-3:8080'
        labels:
          service: kv-node
